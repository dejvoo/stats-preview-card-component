<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Stats Preview Card Component</title>
  </head>
  <body>
    <div class="container">
      <main class="main-content">
        <section class="card-image">
          <picture>
            <source
              media="(min-width: 320px)"
              srcset="image-header-mobile.jpg"
            />
            <source
              media="(min-width: 700px)"
              srcset="image-header-desktop.jpg"
            />
            <img src="image-header-desktop.jpg" alt="" />
          </picture>
        </section>
        <section class="card-text">
          <h1 class="card-heading">
            Get <span>insights</span> that help your business grow.
          </h1>
          <p class="card-description">
            Discover the benefits of data analytics and make better decisions
            regarding revenue, customer experience, and overall efficiency.
          </p>
          <div class="stats-container">
            <div class="stats">
              <p class="stats-number">10k+</p>
              <p class="stats-category">companies</p>
            </div>
            <div class="stats">
              <p class="stats-number">314</p>
              <p class="stats-category">templates</p>
            </div>
            <div class="stats">
              <p class="stats-number">12M+</p>
              <p class="stats-category">queries</p>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
